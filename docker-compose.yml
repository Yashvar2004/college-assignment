services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okdriver}
      POSTGRES_USER: ${POSTGRES_USER:-okdriver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-okdriver} -d ${POSTGRES_DB:-okdriver}"], interval: 5s, timeout: 5s, retries: 10}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10}
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://okdriver:change-me-local-only@db:5432/okdriver}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-production-123}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:8080,http://127.0.0.1:8080}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck: {test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"], interval: 10s, timeout: 5s, retries: 10}
  web:
    build:
      context: ./apps/web
      args: {VITE_API_URL: "http://localhost:8000/api/v1", VITE_WS_URL: "ws://localhost:8000/api/v1/ws"}
    ports: ["8080:80"]
    depends_on: {api: {condition: service_healthy}}
volumes: {postgres_data: {}, redis_data: {}}
